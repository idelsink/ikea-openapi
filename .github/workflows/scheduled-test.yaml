name: Scheduled Contract Testing

on:
  workflow_call:
    inputs:
      test-target:
        type: string
        required: true
        default: '*'

  workflow_dispatch: # Manual trigger

jobs:
  contract-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2025.12.13
      - run: mise run test:schemathesis:${{ inputs.test-target }} --phases examples

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: schemathesis-report-${{ inputs.test-target }}
          path: openapi/**/schemathesis-report/*
