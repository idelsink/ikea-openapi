name: Scheduled Contract Testing

on:
  workflow_call:
    inputs:
      test-target:
        type: string
        required: true
        default: '*'

  workflow_dispatch: # Manual trigger

jobs:
  contract-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2025.8.21
      - run: mise run test:schemathesis:${{ inputs.test-target }} --phases examples

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: schemathesis-report-${{ inputs.test-target }}
          path: openapi/**/schemathesis-report/*
