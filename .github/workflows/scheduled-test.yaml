name: Scheduled Contract Testing

on:
  workflow_call:
    inputs:
      test-target:
        type: string
        required: true
        default: '*'

  workflow_dispatch: # Manual trigger

jobs:
  contract-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
      - run: mise run test:schemathesis:${{ inputs.test-target }} --phases examples

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: schemathesis-report-${{ inputs.test-target }}
          path: openapi/**/schemathesis-report/*
