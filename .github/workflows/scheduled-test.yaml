name: Scheduled Contract Testing

on:
  workflow_call:
    inputs:
      test-target:
        type: string
        required: true
        default: '*'

  workflow_dispatch: # Manual trigger

jobs:
  contract-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3.5.1
        with:
          version: 2025.8.21
      - run: mise run test:schemathesis:${{ inputs.test-target }} --phases examples

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: schemathesis-report-${{ inputs.test-target }}
          path: openapi/**/schemathesis-report/*
